apiVersion: apps/v1
kind: Deployment
metadata:
  name: paved-road-app
  labels:
    app: paved-road-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paved-road-app
  template:
    metadata:
      labels:
        app: paved-road-app
    spec:
      containers:
        - name: app
          image: paved-road-app
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
